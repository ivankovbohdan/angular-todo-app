<div class="todoapp">
  <h1 class="todoapp__title">todos {{todos.length}} </h1>

  <div class="todoapp__content">
    <header class="todoapp__header">

      <button type="button" class="todoapp__toggle-all active"></button>

      <app-todo-form (save)="addTodo($event)"></app-todo-form>
    </header>

    <section class="todoapp__main">
      <app-todo *ngFor="let todo of visibleTodos; let i = index; trackBy: trackById" [todo]="todo"
        (delete)="deleteTodo(todo.id)" (rename)="renameTodo(todo.id, $event)" (toggle)="toggleTodo(todo.id)"></app-todo>
    </section>

    <footer class="todoapp__footer">
      <span class="todo-count">
        {{ activeTodos.length }} items left
      </span>

      <nav class="filter">
        <a href="#/" class="filter__link" [class.selected]="filter === 'all'" (click)="setFilter('all')">All</a>

        <a href="#/active" class="filter__link" [class.selected]="filter === 'active'"
          (click)="setFilter('active')">Active</a>

        <a href="#/completed" class="filter__link" [class.selected]="filter === 'completed'"
          (click)="setFilter('completed')">Completed</a>
      </nav>

      <button type="button" class="todoapp__clear-completed" (click)="clearCompleted()">
        Clear completed
      </button>
    </footer>
  </div>

    <button type="button" class="delete"></button>

    <br />

    <br />

  @if (error) {
  <div class="notification is-danger is-light has-text-weight-normal">
    <button type="button" class="delete" (click)="error = ''"></button>
    {{ error }}
  </div>
  }
</div>
